name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather
# than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export the web build
        working-directory: apps/app
        env:
          # Matches this repo's GitHub Pages project-site subpath
          # (https://<user>.github.io/<repo>/) — see app.config.js.
          WEB_BASE_PATH: /phonicspal-rn
        run: npx expo export --platform web

      - name: Add SPA fallback for client-side routes
        # expo-router's static export emits one HTML file per *route
        # pattern* (e.g. read/[id].html), not one per real URL — a
        # direct load or refresh on /read/some-story has no matching
        # file. Pages serves 404.html for any unmatched path, so using
        # the app shell as that fallback lets expo-router's client-side
        # router take over and render the right screen.
        run: cp apps/app/dist/index.html apps/app/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
